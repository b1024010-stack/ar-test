<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>函館市電 500形 花もめんラッピング AR</title>

  <!-- model-viewer を読み込む -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #e9eef3; }
    .title {
      position: absolute; top: 16px; left: 16px; right: 16px;
      font-size: 18px; font-weight: bold; color: #1c2a44;
    }
    .note { font-size: 13px; font-weight: normal; color: #555; margin-top: 4px; }
    .ar-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: none; border-radius: 30px;
      background: #1a73e8; color: #ffffff; font-size: 16px;
    }
  </style>
</head>
<body>

  <model-viewer
    src="hanamomen.glb"
    alt="函館市電 500形（花もめんラッピング）の3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    camera-orbit="35deg 75deg auto"
    auto-rotate
    shadow-intensity="1">

    <div class="title">
      函館市電 500形（花もめんラッピング）
      <div class="note">ARでは実物大（全長約13m）で表示されます。2本指でつまむと小さくできます。</div>
    </div>

    <button slot="ar-button" class="ar-btn">📷 ARで見る</button>
  </model-viewer>

</body>
</html>
