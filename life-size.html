<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>函館市電 500形 花もめんラッピング AR</title>
<script src="count.js"></script>  <!-- アクセス数（GoatCounter） -->
<!-- ホーム画面に追加したとき、アプリのように開くための設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ジャッチュ">


  <!-- model-viewer を読み込む -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; height: 100dvh; background: #e9eef3; }
    .home { display:inline-flex; align-items:center; min-height:40px; padding:0 12px; margin-bottom:8px; border-radius:8px;
            background:#0b0b0c; color:#ffb020; text-decoration:none; font-size:15px; font-weight:normal; }
    .title {
      position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px;
      font-size: 18px; font-weight: bold; color: #1c2a44;
    }
    .note { font-size: 13px; font-weight: normal; color: #555; margin-top: 4px; }
    .ar-btn {
      position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: none; border-radius: 30px;
      background: #1a73e8; color: #ffffff; font-size: 16px;
    }
  </style>
</head>
<body>

  <model-viewer
    src="hanamomen.glb"
    ios-src="hanamomen.usdz"
    alt="函館市電 500形（花もめんラッピング）の3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    camera-orbit="35deg 75deg 28m"
    camera-target="0m 2m 0m"
    autoplay
    animation-name="Run"
    shadow-intensity="1">

    <div class="title">
      <a class="home" href="index.html">← ホーム</a><br>
      函館市電 500形（花もめんラッピング）
      <div class="note">前後に6m走って停車し、ヘッドライトが点滅します。ARでは実物大（全長約13m）で表示されます。2本指でつまむと小さくできます。</div>
    </div>

    <button slot="ar-button" class="ar-btn">📷 ARで見る</button>
  </model-viewer>

<script>
  // ARを始めた数（実物大）
  document.querySelector(".ar-btn").addEventListener("click", () => jatchuCount("AR開始 → 実物大"));
</script>
</body>
</html>
