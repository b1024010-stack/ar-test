<style>
  :root{ --bg:#0b0b0c; --amber:#ffb020; --white:#f4f1e8; --pink:#ff5a7a; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--white);font-family:"BIZ UDPGothic",-apple-system,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom))}
  .pad{padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
  .top{display:flex;align-items:center;gap:10px}
  .top h1{flex:1;min-width:0;margin:0;font-size:22px;font-weight:900}
  .sub{margin:6px 0 12px;font-size:13px;color:#a8a8b0;line-height:1.6}

  /* 電車が流れてくる舞台 */
  .stage{position:relative;height:min(46vh,330px);min-height:220px;background:#101a2e;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}
  .stage canvas{display:block;width:100%;height:100%}
  .hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(255,176,32,.92);
        color:#111;font-size:14px;font-weight:900;pointer-events:none;animation:wig 1.4s ease-in-out infinite;white-space:nowrap}
  @keyframes wig{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% - 14px))}}
  .meter{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:11px;color:#c9d2e3;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:12px;pointer-events:none}
  .meter i{display:block;width:70px;height:6px;border-radius:3px;background:#2b3550;overflow:hidden}
  .meter b{display:block;height:100%;width:20%;background:linear-gradient(90deg,#4fd8ff,#ffb020,#ff5a7a)}
  .wm{position:absolute;left:8px;bottom:6px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:bold;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
  .wm img{width:16px;height:16px;border-radius:4px}
  .toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:#ff5a7a;color:#fff;
         font-size:13px;font-weight:900;pointer-events:none;white-space:nowrap}

  .make{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 0;min-height:56px;border-radius:28px;background:var(--amber);
        color:#111;text-decoration:none;font-size:17px;font-weight:900}
  h2{font-size:13px;color:#8a8a90;font-weight:normal;margin:22px 2px 8px}
  .rank{border-radius:12px;overflow:hidden;border:1px solid #2c2c30}
  .ri{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 12px;background:#141417;border:0;border-top:1px solid #222226;color:var(--white);text-align:left;cursor:pointer;font:inherit}
  .ri:first-child{border-top:0}
  .ri .no{flex:none;width:20px;font-weight:900;color:#777;text-align:center}
  .ri img{flex:none;width:96px;height:20px;object-fit:cover;border-radius:4px}
  .ri .nm{flex:1;min-width:0}
  .ri .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ri .nm small{display:block;font-size:11px;color:#8f8f96}
  .ri .lk{flex:none;font-size:13px;color:var(--pink);font-weight:700}
  .note{margin:14px 2px 0;font-size:11px;color:#777;line-height:1.7}

  /* 電車をタップしたときの画面 */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
  .sheet[hidden]{display:none}
  .panel{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:#17171b;border-radius:18px 18px 0 0;
         padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .panel .bar{width:40px;height:5px;border-radius:3px;background:#444;margin:0 auto 10px}
  .panel canvas{display:block;width:100%;height:auto;background:#101a2e;border-radius:10px}
  .ph{margin-top:12px}
  .ph b{display:block;font-size:19px}
  .ph small{font-size:12px;color:#8f8f96}
  .acts{display:grid;gap:8px;margin-top:14px}
  .acts[hidden]{display:none}
  .acts a,.acts button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:25px;font-size:16px;font-weight:900;text-decoration:none;cursor:pointer;font-family:inherit}
  .acts .run{background:var(--amber);color:#111;border:0}
  .acts .edit{background:transparent;color:var(--amber);border:2px solid var(--amber)}
  .acts .del{background:transparent;color:#ff8a7a;border:1px solid #4a2a2a;min-height:42px;font-size:14px;font-weight:700}
  .close{display:block;width:100%;margin-top:10px;min-height:46px;border-radius:23px;border:1px solid #3a3a40;background:transparent;color:#ddd;font-size:15px}
  .empty{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#132033;border:1px solid #2d4a73;font-size:13px;line-height:1.7;color:#cfe3ff}
  /* ===== 下のタブ（全ページ共通） ===== */
  .jt-tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
           background:rgba(11,11,12,.96);border-top:1px solid #2a2a2d;padding-bottom:env(safe-area-inset-bottom);
           -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .jt-tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;
             color:#8a8a90;text-decoration:none;font-size:11px;font-family:"BIZ UDPGothic",-apple-system,"Hiragino Sans",sans-serif}
  .jt-tabs a span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
  .jt-tabs a.on{color:#ffb020}
  .jt-tabs a.on span{filter:none;opacity:1}
  .jt-tabs a small{font-size:1em}
  button,input,select,textarea{font-family:inherit}
</style>

let TRAMS = [];
const slots = new Map();
function slotTram(i){
  if (!TRAMS.length) return null;
  if (!slots.has(i)){ const n = TRAMS.length; slots.set(i, TRAMS[((i % n) + n) % n]); }   // 順番に流す
  return slots.get(i);
}
// ---- 電車をかく（車体の横の絵 ＋ 窓・屋根・車輪） ----
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawTram(g, t, x, base, w, wireY){
  const h = w * 0.212, y = base - h - w * 0.045;
  // パンタグラフ
  g.strokeStyle = "#c9ced6"; g.lineWidth = Math.max(1.5, w * 0.006);
  const px = x + w * 0.5; g.beginPath(); g.moveTo(px - w * 0.05, y - h * 0.08); g.lineTo(px, wireY + 2); g.lineTo(px + w * 0.05, y - h * 0.08); g.stroke();
  g.beginPath(); g.moveTo(px - w * 0.03, wireY + 1); g.lineTo(px + w * 0.03, wireY + 1); g.stroke();
  // 屋根
  g.fillStyle = "#9aa3ae"; rr(g, x + w * 0.04, y - h * 0.11, w * 0.92, h * 0.16, h * 0.07); g.fill();
  // 車体（デザインの絵）
  g.save(); rr(g, x, y, w, h, h * 0.24); g.clip();
  if (t.im.complete && t.im.naturalWidth) g.drawImage(t.im, x, y, w, h); else { g.fillStyle = "#fff"; g.fillRect(x, y, w, h); }
  // 窓
  g.fillStyle = "rgba(24,36,56,.92)";
  const wy = y + h * 0.12, wh = h * 0.3, ww = w * 0.072, gap = w * 0.03;
  for (let i = 0; i < 4; i++){ rr(g, x + w * 0.045 + i * (ww + gap), wy, ww, wh, h * 0.04); g.fill(); rr(g, x + w * 0.955 - ww - i * (ww + gap), wy, ww, wh, h * 0.04); g.fill(); }
  g.strokeStyle = "rgba(40,50,70,.35)"; g.lineWidth = Math.max(1, w * 0.002);   // 扉（線だけ。デザインの文字をかくさない）
  g.strokeRect(x + w * 0.47, y + h * 0.1, w * 0.06, h * 0.82); g.beginPath(); g.moveTo(x + w * 0.5, y + h * 0.1); g.lineTo(x + w * 0.5, y + h * 0.92); g.stroke();
  g.restore();
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 1.2; rr(g, x, y, w, h, h * 0.24); g.stroke();
  // ライト
  g.fillStyle = "#fff6c0"; g.beginPath(); g.arc(x + w * 0.012, y + h * 0.72, h * 0.04, 0, 7); g.arc(x + w * 0.988, y + h * 0.72, h * 0.04, 0, 7); g.fill();
  // 台車と車輪
  g.fillStyle = "#2a2f38";
  for (const cx of [0.17, 0.83]){ rr(g, x + w * (cx - 0.11), y + h * 0.98, w * 0.22, h * 0.13, h * 0.04); g.fill(); }
  g.fillStyle = "#3a3f48";
  for (const cx of [0.11, 0.23, 0.77, 0.89]){ g.beginPath(); g.arc(x + w * cx, y + h * 1.13, h * 0.1, 0, 7); g.fill(); }
}

// ---- 舞台 ----
const cv = $("cv"), g = cv.getContext("2d"), stage = $("stage");
let CW = 0, CH = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = stage.clientWidth; CH = stage.clientHeight;
  cv.width = CW * DPR; cv.height = CH * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();
const L = () => Math.min(CW * 0.9, CH * 2.6, 760), GAP = () => L() * 0.16, P = () => L() + GAP();
const V0 = () => Math.max(60, CW * 0.16);          // ふだんの速さ（px/秒）
let off = -CW * 0.6, v = V0(), dragging = null, lastTime = performance.now(), bgOff = 0;
// 町並み（遠くの建物）
const town = Array.from({ length: 40 }, (_, i) => ({ w: 30 + (i * 37) % 50, h: 30 + (i * 53) % 70, win: (i * 7) % 3 }));
function drawScene(){
  g.fillStyle = "#101a2e"; g.fillRect(0, 0, CW, CH);
  // 星
  g.fillStyle = "rgba(255,255,255,.5)";
  for (let i = 0; i < 30; i++){ const x = ((i * 97) - bgOff * 0.05) % CW; g.fillRect((x + CW) % CW, (i * 53) % (CH * 0.35), 1.5, 1.5); }
  // 町並み（ゆっくり動く）
  const baseY = CH * 0.72; let x = -((bgOff * 0.35) % 2200);
  for (let k = 0; x < CW; k++){
    const b = town[k % town.length];
    g.fillStyle = "#1a2742"; g.fillRect(x, baseY - b.h, b.w, b.h);
    g.fillStyle = "rgba(255,214,102,.55)";
    for (let yy = baseY - b.h + 8; yy < baseY - 8; yy += 12) for (let xx = x + 6; xx < x + b.w - 6; xx += 10) if (((xx + yy) | 0) % (b.win + 3) === 0) g.fillRect(xx, yy, 4, 5);
    x += b.w + 6;
  }
  // 架線と電柱
  const wireY = CH * 0.1;
  g.strokeStyle = "#3b4d6b"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, wireY); g.lineTo(CW, wireY); g.stroke();
  g.fillStyle = "#2c3a55";
  for (let p = -((bgOff) % 260); p < CW; p += 260) g.fillRect(p, wireY - 6, 5, CH * 0.78);
  // 線路
  const railY = CH * 0.9;
  g.fillStyle = "#26324a"; g.fillRect(0, railY, CW, CH - railY);
  g.fillStyle = "#4b5872"; for (let p = -((bgOff) % 22); p < CW; p += 22) g.fillRect(p, railY + 4, 12, 5);
  g.fillStyle = "#9aa6b8"; g.fillRect(0, railY, CW, 3);
  return { wireY, railY };
}
// 速いときの線（ポケカのパックを開けるときのような、勢いの演出）
function speedLines(){
  const s = Math.min(1, Math.max(0, (Math.abs(v) - V0() * 2) / (V0() * 10))); if (!s) return;
  g.strokeStyle = `rgba(255,255,255,${0.35 * s})`; g.lineWidth = 2;
  for (let i = 0; i < 14; i++){ const y = (i * 37 + (performance.now() / 7) % 37) % CH, len = 40 + 120 * s; const x = (i * 131 + performance.now() * 0.9) % (CW + len) - len;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke(); }
}
function frame(now){
  const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now;
  if (!dragging){
    off += v * dt;
    v += (V0() - v) * (1 - Math.exp(-dt * 0.9));     // はじいた勢いが、だんだんふだんの速さにもどる
  }
  bgOff += (dragging ? 0 : v * dt);
  const { wireY, railY } = drawScene();
  const p = P(), w = L();
  const i0 = Math.floor((off - w) / p), i1 = Math.ceil((off + CW) / p);
  for (let i = i0; i <= i1; i++){ const x = i * p - off, t = slotTram(i); if (t && x < CW && x + w > 0) drawTram(g, t, x, railY, w, wireY); }
  speedLines();
  $("mtr").style.width = Math.min(100, Math.abs(v) / (V0() * 12) * 100 + 8) + "%";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- スワイプ ----
let hintOff = false;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  dragging = { x: e.clientX, y: e.clientY, off, t: performance.now(), lx: e.clientX, lt: performance.now(), vel: 0, moved: false };
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - dragging.x;
  if (Math.abs(dx) > 6) dragging.moved = true;
  off = dragging.off - dx;
  bgOff -= (e.clientX - dragging.lx);
  const now = performance.now(), dt = Math.max(1, now - dragging.lt);
  dragging.vel = dragging.vel * 0.6 + (-(e.clientX - dragging.lx) / dt * 1000) * 0.4;
  dragging.lx = e.clientX; dragging.lt = now;
  if (dragging.moved && !hintOff){ hintOff = true; $("hint").hidden = true; }
});
const up = e => {
  if (!dragging) return;
  const d = dragging; dragging = null;
  if (!d.moved && performance.now() - d.t < 500){ tapAt(e.clientX - stage.getBoundingClientRect().left, e.clientY - stage.getBoundingClientRect().top); return; }
  v = Math.max(-V0() * 14, Math.min(V0() * 14, d.vel));     // はじいた勢いで走る
};
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
function tapAt(x, y){
  const p = P(), w = L(), i = Math.floor((x + off) / p), tx = i * p - off;
  if (x >= tx && x <= tx + w && slotTram(i)) openSheet(slotTram(i));
}


// ---- 一覧 ----
function fmt(t){ try { return new Date(t).toLocaleString(JL.lang, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch(e){ return ""; } }
function renderList(){
  const mine = TRAMS.filter(t => !t.example);
  $("listTitle").textContent = JL.t("my.list", { n: mine.length });
  $("rank").innerHTML = mine.length ? mine.map((t, i) =>
    `<button class="ri" data-id="${esc(t.id)}"><span class="no">${i + 1}</span><img src="${t.img}" alt=""><span class="nm"><b>${esc(t.name)}</b>` +
    `<small>${esc(JL.t("my.when", { d: fmt(t.updated) }))}</small></span><span style="color:#666">›</span></button>`).join("")
    : `<div class="ri" style="cursor:default;color:#888">${esc(JL.t("my.none"))}</div>`;
}
$("rank").onclick = e => { const b = e.target.closest(".ri[data-id]"); if (b) openSheet(TRAMS.find(t => t.id === b.dataset.id)); };

// ---- 電車をタップしたとき ----
let cur = null;
function openSheet(t){
  cur = t; $("sheet").hidden = false;
  const big = $("big"), bg = big.getContext("2d");
  bg.fillStyle = "#101a2e"; bg.fillRect(0, 0, big.width, big.height);
  bg.fillStyle = "#9aa6b8"; bg.fillRect(0, 270, big.width, 3);
  bg.strokeStyle = "#3b4d6b"; bg.beginPath(); bg.moveTo(0, 28); bg.lineTo(big.width, 28); bg.stroke();
  const draw = () => drawTram(bg, t, 30, 270, big.width - 60, 28);
  if (t.im.complete) draw(); else t.im.onload = draw;
  $("dName").textContent = t.name;
  $("dWhen").textContent = t.example ? JL.t("my.sample") : JL.t("my.when", { d: fmt(t.updated) });
  $("acts").hidden = !!t.example;
  $("aRun").href = "rail.html?id=" + encodeURIComponent(t.id);
  $("aEdit").href = "maker.html?id=" + encodeURIComponent(t.id);
}
$("aDel").onclick = async () => {
  if (!cur || cur.example) return;
  if (!confirm(JL.t("my.delq", { name: cur.name }))) return;
  await JatchuDB.remove(cur.id); close(); load();
};
const close = () => { $("sheet").hidden = true; cur = null; };
$("closeBtn").onclick = close;
$("sheet").onclick = e => { if (e.target === $("sheet")) close(); };

// ---- 読み込み ----
async function load(){
  let list = [];
  try { list = await JatchuDB.list(); } catch (e) { console.warn(e); }
  TRAMS = list.map(d => ({ id: d.id, name: d.name, img: d.thumb, updated: d.updated }));
  $("empty").hidden = TRAMS.length > 0;
  if (!TRAMS.length) TRAMS = EXAMPLES.map(x => ({ ...x, example: true }));
  for (const t of TRAMS){ t.im = new Image(); t.im.src = t.img; }
  slots.clear(); renderList();
}
load();
document.addEventListener("jatchu-lang", renderList);
</script>
