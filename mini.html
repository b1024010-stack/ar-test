<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ジャッチュ お店の電車 AR</title>

  <!-- model-viewer を読み込む -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #e9eef3; }

    .top {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .back {
      font-family: "DotGothic16", monospace; font-size: 14px; text-decoration: none;
      color: #ffb020; background: #0b0b0c; padding: 7px 12px; border-radius: 4px;
    }
    .scale { font-size: 12px; color: #555; }

    /* お店の切り替え */
    .chips {
      position: absolute; top: 56px; left: 0; right: 0; padding: 0 12px;
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; padding: 6px 12px; border-radius: 16px; border: 1px solid #b9c2cc;
      background: #fff; color: #1c2a44; font-size: 13px; cursor: pointer;
    }
    .chip.on { background: #1c2a44; color: #fff; border-color: #1c2a44; }

    /* 電光掲示板ふうのお店カード */
    .card {
      position: absolute; left: 12px; right: 12px; bottom: 86px; max-width: 480px; margin: 0 auto;
      background: #050505; border: 5px solid #2a2a2d; border-radius: 6px; padding: 10px 12px;
      font-family: "DotGothic16", monospace; color: #ffb020; letter-spacing: .04em;
    }
    .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card .name { font-size: 20px; color: #f4f1e8; text-shadow: 0 0 3px currentColor; }
    .card .genre { font-size: 12px; color: #999; }
    .card .st { font-size: 15px; text-shadow: 0 0 3px currentColor; white-space: nowrap; }
    .ok { color: #3dff6e; } .few { color: #ffb020; } .full { color: #ff3b30; }
    .card .menu { margin-top: 6px; font-size: 15px; text-shadow: 0 0 3px currentColor; }
    .card .catch { font-size: 12px; color: #aaa; margin-top: 2px; }

    .ar-btn {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: none; border-radius: 30px; white-space: nowrap;
      background: #1a73e8; color: #ffffff; font-size: 16px;
    }
  </style>
</head>
<body>

  <model-viewer id="mv"
    src="hanamomen_mini.glb?v=4"
    alt="お店のラッピング電車が走るミニチュア周回モデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    camera-orbit="30deg 55deg auto"
    autoplay
    animation-name="Loop"
    shadow-intensity="1">

    <div class="top">
      <a class="back" href="board.html">← 案内板</a>
      <span class="scale">1/80 ・ ARでは約88cm×58cm</span>
    </div>

    <div class="chips" id="chips"></div>

    <div class="card">
      <div class="row">
        <div>
          <div class="name" id="cName">—</div>
          <div class="genre" id="cGenre"></div>
        </div>
        <div class="st" id="cSt"></div>
      </div>
      <div class="menu" id="cMenu"></div>
      <div class="catch" id="cCatch"></div>
    </div>

    <button slot="ar-button" class="ar-btn">📷 ARで走らせる</button>
  </model-viewer>

<script src="shops.js"></script>
<script>
  const SHOPS = window.JATCHU_SHOPS, ST = window.JATCHU_STATUS;
  const mv = document.getElementById("mv");
  const $ = id => document.getElementById(id);

  // URL の ?shop=xxx でお店を決める（なければ花もめん）
  const qid = new URLSearchParams(location.search).get("shop");
  let current = SHOPS.find(s => s.id === qid) || SHOPS[0];

  let wrapMat = null, originalTex = null;
  const texCache = {};

  // お店の切り替えボタン
  $("chips").innerHTML = SHOPS.map(s =>
    `<button class="chip" data-id="${s.id}">${s.name}号</button>`).join("");
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    current = SHOPS.find(s => s.id === b.dataset.id);
    history.replaceState(null, "", "?shop=" + current.id);
    apply();
  });

  function showCard(){
    const [label, cls] = ST[current.st];
    $("cName").textContent  = current.name + "号";
    $("cGenre").textContent = current.genre;
    $("cSt").textContent    = label;  $("cSt").className = "st " + cls;
    $("cMenu").textContent  = "本日限定：" + current.menu;
    $("cCatch").textContent = current.catch;
    document.title = current.name + "号 | ジャッチュ AR";
    document.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("on", c.dataset.id === current.id));
  }

  async function apply(){
    showCard();

    // iPhone：花もめんは Blender で作った動く usdz、それ以外は自動変換（動かない）
    if (current.wrap) mv.removeAttribute("ios-src");
    else mv.setAttribute("ios-src", "hanamomen_mini.usdz?v=4");

    if (!wrapMat) return;   // モデルの読み込み前なら、読み込み後にもう一度呼ばれる
    let tex = originalTex;
    if (current.wrap) {
      tex = texCache[current.id] ||
            (texCache[current.id] = await mv.createTexture(current.wrap + "?v=1"));
    }
    wrapMat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
  }

  mv.addEventListener("load", () => {
    wrapMat = mv.model.materials.find(m => m.name === "H500_Wrap_Baked");
    originalTex = wrapMat.pbrMetallicRoughness.baseColorTexture.texture;
    apply();
  });

  apply();
</script>
</body>
</html>
