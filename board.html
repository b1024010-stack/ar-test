<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="bd.title">大門町 案内板 | ジャッチュ</title>
<script src="count.js"></script>  <!-- アクセス数（GoatCounter） -->
<!-- ホーム画面に追加したとき、アプリのように開くための設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ジャッチュ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --panel:#050505; --frame:#2a2a2d;
    --amber:#ffb020; --amber-dim:#5a3a06;
    --green:#3dff6e; --red:#ff3b30; --white:#f4f1e8; --cyan:#4fd8ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--amber);font-family:"DotGothic16",monospace;
       -webkit-font-smoothing:none;letter-spacing:.04em}
  .wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 10px}
  header h1{margin:0;font-size:20px;color:var(--white);font-weight:normal}
  header .sub{font-size:12px;color:#888}
  #clock{font-size:22px;color:var(--white)}

  .board{background:var(--panel);border:6px solid var(--frame);border-radius:6px;margin-bottom:14px;
         box-shadow:inset 0 0 0 1px #000, 0 2px 0 #000;position:relative;overflow:hidden}
  /* LEDのドット感 */
  .board::after{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 56%);
    background-size:3px 3px}
  .board h2{margin:0;padding:6px 10px;font-size:14px;font-weight:normal;color:var(--white);
            background:#1a1a1c;border-bottom:2px solid #000;display:flex;justify-content:space-between}
  .board h2 small{color:#999;font-size:11px}
  .glow{text-shadow:0 0 3px currentColor}

  table{width:100%;border-collapse:collapse;font-size:16px}
  td{padding:7px 8px;white-space:nowrap;border-bottom:1px dashed #1e1e1e}
  tr:last-child td{border-bottom:none}
  .num{width:3.6em;color:var(--white)}
  .kei{display:inline-block;min-width:2.6em;text-align:center;border:1px solid currentColor;padding:0 3px;font-size:13px}
  .k2{color:var(--cyan)} .k5{color:var(--green)}
  .dest{color:var(--amber)}
  .min{text-align:right;color:var(--amber);width:5.8em}
  .min b{font-size:22px;font-weight:normal}
  .soon{color:var(--red)!important;animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}

  /* 接近表示 */
  .approach{padding:8px 10px 10px;font-size:12px;color:#aaa;border-top:2px solid #000;background:#080808}
  .line{display:flex;align-items:center;gap:0;margin:6px 0 2px}
  .stop{flex:1;text-align:center;position:relative;color:#777;font-size:11px}
  .stop .dot{display:block;margin:0 auto 3px;width:9px;height:9px;border-radius:50%;background:#333}
  .stop.here{color:var(--white)} .stop.here .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .seg{flex:.6;height:3px;background:#333;position:relative;top:-7px}
  .tram{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--cyan)}
  .stop .tram{top:-14px}

  .ar-btn{display:block;width:100%;margin:10px 0 0;padding:14px 12px;min-height:48px;border:2px solid var(--amber);background:transparent;
          color:var(--amber);font-family:inherit;font-size:16px;border-radius:4px;text-decoration:none;text-align:center}
  .ar-btn:active{background:var(--amber);color:#000}

  .status{width:5.2em;text-align:right}
  .ok{color:var(--green)} .few{color:var(--amber)} .full{color:var(--red)}
  .genre-sub{display:block;color:#999;font-size:12px;margin-top:2px}
  .arcell{width:4.6em;text-align:right}
  .mini-ar{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:4.2em;padding:4px 8px;border:1px solid var(--cyan);color:var(--cyan);
           border-radius:3px;text-decoration:none;font-size:13px}
  .mini-ar:active{background:var(--cyan);color:#000}
  .shop{color:var(--white)}
  .time{color:var(--white);width:3.6em}
  .place{display:block;color:#999;font-size:12px;margin-top:2px;text-shadow:none}
  .ev td{white-space:normal}

  /* 流れる文字 */
  .ticker{overflow:hidden;white-space:nowrap;padding:10px 0;font-size:18px}
  .ticker span{display:inline-block;padding-left:100%;animation:scroll 28s linear infinite}
  @keyframes scroll{to{transform:translateX(-100%)}}

  .legend{font-size:11px;color:#777;padding:4px 10px 8px}
  footer{font-size:11px;color:#666;text-align:center;margin-top:8px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){.ticker span,.soon{animation:none}}

  /* ===== 下のタブ（全ページ共通） ===== */
  .jt-tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);
           background:rgba(11,11,12,.96);border-top:1px solid #2a2a2d;padding-bottom:env(safe-area-inset-bottom);
           -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .jt-tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;
             color:#8a8a90;text-decoration:none;font-size:11px;font-family:-apple-system,"Hiragino Sans",sans-serif;letter-spacing:0}
  .jt-tabs a span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
  .jt-tabs a.on{color:#ffb020}
  .jt-tabs a.on span{filter:none;opacity:1}
  .jt-tabs a small{font-size:1em}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 data-i18n="bd.title">大門町 案内板</h1>
      <div class="sub" data-i18n="bd.sub">ジャッチュ ／ 函館駅前・松風町</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div id="clock" class="glow">--:--</div>
      <div id="langSw"></div>
    </div>
  </header>

  <!-- ① 市電の接近情報 -->
  <section class="board">
    <h2><span id="platform">市電 函館駅前 のりば</span> <small id="upd">--:-- 更新</small></h2>
    <table id="trams"></table>
    <div class="approach">
      <div id="approach">▼ 次の電車の位置（湯の川方面）</div>
      <div class="line" id="line"></div>
      <a class="ar-btn glow" id="waitAr" href="mini.html">📷 待ち時間にARで電車を見る</a>
    </div>
  </section>

  <!-- ② 空席情報 -->
  <section class="board">
    <h2><span data-i18n="idx.open">いま入れるお店</span> <small id="shopsUpd"></small></h2>
    <table id="shops"></table>
  </section>

  <a class="ar-btn glow" href="maker.html" style="margin:-4px 0 14px" data-i18n="bd.maker">🎨 じぶんの電車をつくって走らせる</a>

  <!-- ③ 本日の限定メニュー（流れる文字） -->
  <section class="board">
    <h2 data-i18n="bd.menus">本日の限定メニュー</h2>
    <div class="ticker glow"><span id="ticker"></span></div>
  </section>

  <!-- ④ 今日のイベント -->
  <section class="board">
    <h2 data-i18n="bd.events">今日のイベント</h2>
    <table id="events" class="ev"></table>
  </section>

  <footer data-i18n-html="bd.footer">
    ※ 表示している時刻・店舗・イベントはすべてサンプルです。<br>
    実際のサービスでは、市電の運行情報とお店の管理画面につないで自動で更新します。
  </footer>
</div>

<nav class="jt-tabs">
  <a href="index.html"><span>🏠</span><small data-i18n="tab.home">ホーム</small></a>
  <a href="gallery.html"><span>👀</span><small data-i18n="tab.gallery">みんな</small></a>
  <a href="maker.html"><span>🎨</span><small data-i18n="tab.maker">つくる</small></a>
  <a href="mini.html"><span>🚋</span><small data-i18n="tab.ar">AR</small></a>
</nav>
<script src="shops.js"></script>
<script src="lang.js"></script>
<script>
/* =========================================================
   ここを書き換えると表示が変わります（サンプルデータ）
   ========================================================= */
const TRAMS = [   // 系統・行き先・運転間隔(分)・ずらし(分)
  { kei:"2", dest:"谷地頭",       every:12, offset:2 },
  { kei:"5", dest:"函館どつく前", every:12, offset:8 },
  { kei:"2", dest:"湯の川",       every:12, offset:5 },
  { kei:"5", dest:"湯の川",       every:12, offset:11 },
];
// 電停ごとの設定（QRコードの ?stop=◯◯ で切り替え）
//   line  : 湯の川方面の電車が来る順番（その電停の手前の停留場）
//   shift : 函館駅前とくらべて、電車が何分おそく来るか（サンプル）
const STOPS = {
  ekimae:    { name:"函館駅前", line:["十字街","魚市場通","市役所前","函館駅前"], shift:0 },
  matsukaze: { name:"松風町",   line:["魚市場通","市役所前","函館駅前","松風町"], shift:2 },
};
const STOP = STOPS[new URLSearchParams(location.search).get("stop")] || STOPS.ekimae;
const LINE_STOPS = STOP.line;
const MIN_PER_STOP = 2;   // 1区間あたりの目安（分）

// お店のデータは shops.js（Google スプレッドシートにつないだときはその表）から読みます
let SHOPS = window.JATCHU_SHOPS;
const EXTRA_MENUS = ["bd.extra"];   // 訳は lang.js の DICT にあります

const EVENTS = [  // 時刻・内容・場所（外国語は en / zh-Hant / zh-Hans / ko。無ければ日本語）
  { time:"17:00",
    title:{ ja:"ARスタンプラリー 開始", en:"AR stamp rally starts", "zh-Hant":"AR集章活動 開始", "zh-Hans":"AR集章活动 开始", ko:"AR 스탬프 랠리 시작" },
    place:{ ja:"大門町一帯", en:"Around Daimon", "zh-Hant":"大門町一帶", "zh-Hans":"大门町一带", ko:"다이몬초 일대" } },
  { time:"18:30",
    title:{ ja:"ラッピング電車 撮影会", en:"Wrapped tram photo session", "zh-Hant":"彩繪電車 攝影會", "zh-Hans":"彩绘电车 摄影会", ko:"래핑 전차 촬영회" },
    place:{ ja:"函館駅前 停留場", en:"Hakodate-ekimae tram stop", "zh-Hant":"函館站前 電車站", "zh-Hans":"函馆站前 电车站", ko:"하코다테에키마에 정류장" } },
  { time:"19:30",
    title:{ ja:"路上ライブ", en:"Street live music", "zh-Hant":"街頭現場表演", "zh-Hans":"街头现场表演", ko:"거리 라이브" },
    place:{ ja:"グリーンプラザ（例）", en:"Green Plaza (example)", "zh-Hant":"Green Plaza（範例）", "zh-Hans":"Green Plaza（示例）", ko:"그린 플라자 (예시)" } },
  { time:"21:00",
    title:{ ja:"はしご酒タイム 延長", en:"Bar-hopping hours extended", "zh-Hant":"續攤時間 延長", "zh-Hans":"续摊时间 延长", ko:"술집 순례 시간 연장" },
    place:{ ja:"参加店", en:"Participating shops", "zh-Hant":"參加店家", "zh-Hans":"参加店家", ko:"참가 가게" } },
];
/* ========================================================= */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ST = window.JATCHU_STATUS;
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function minutesUntil(now, every, offset){
  const m = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  let next = Math.ceil((m - offset) / every) * every + offset;
  if (next - m < 0.02) next += every;
  return next - m;
}

function renderTrams(){
  const now = new Date();
  $("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  $("upd").textContent = JL.t("bd.updated", { t: pad(now.getHours()) + ":" + pad(now.getMinutes()) });
  $("platform").textContent = JL.t("bd.platform", { stop: JL.name(STOP.name) });
  $("approach").textContent = JL.t("bd.approach", { d: JL.name("湯の川") });

  const rows = TRAMS.map(t => ({...t, left: minutesUntil(now, t.every, t.offset + STOP.shift)}))
                    .sort((a,b) => a.left - b.left);
  $("trams").innerHTML = rows.map((t,i) => {
    const mins = Math.floor(t.left);
    const soon = t.left < 1;
    const txt  = soon ? JL.t("min.soon") : JL.t("min.left", { n: mins });
    return `<tr>
      <td class="num">${JL.t(i===0 ? "bd.first" : "bd.then")}</td>
      <td><span class="kei k${t.kei}">${JL.t("bd.route", { n: t.kei })}</span></td>
      <td class="dest glow">${esc(JL.t("bd.for", { d: JL.name(t.dest) }))}</td>
      <td class="min glow ${soon?"soon":""}">${txt}</td></tr>`;
  }).slice(0,3).join("");

  // 湯の川方面で一番近い電車の位置
  const yu = rows.filter(t => t.dest.startsWith("湯の川"))[0];
  const stopsAway = Math.min(LINE_STOPS.length-1, Math.floor(yu.left / MIN_PER_STOP));
  const idx = LINE_STOPS.length-1 - stopsAway;
  $("line").innerHTML = LINE_STOPS.map((s,i) => {
    const here = i === LINE_STOPS.length-1;
    const tram = i === idx ? `<span class="tram glow">🚋</span>` : "";
    return (i ? `<div class="seg"></div>` : "") +
      `<div class="stop ${here?"here":""}">${tram}<span class="dot"></span>${esc(JL.name(s))}</div>`;
  }).join("");
}

function renderShops(){
  SHOPS = window.JATCHU_SHOPS;
  $("shops").innerHTML = SHOPS.map(s => {
    const cls = ST[s.st][1];
    return `<tr><td><span class="shop glow">${esc(JL.shop(s, "name"))}</span><span class="genre-sub">${esc(JL.shop(s, "genre"))}</span></td>
            <td class="status glow ${cls}">${JL.status(s.st)}</td>
            <td class="arcell"><a class="mini-ar" href="mini.html?shop=${encodeURIComponent(s.id)}">🚋 AR</a></td></tr>`;
  }).join("");
  // 待ち時間ボタン：空席のあるお店からランダムに1つ
  const open = SHOPS.filter(s => s.st !== "full");
  const pick = open[Math.floor(Math.random()*open.length)] || SHOPS[0];
  $("waitAr").href = `mini.html?shop=${pick.id}`;
  $("waitAr").textContent = JL.t("bd.wait", { car: JL.t("car", { name: JL.shop(pick, "name") }) });
  // 流れる文字（本日の限定メニュー）
  $("ticker").textContent = SHOPS.filter(s => s.menu).map(s => `${JL.shop(s, "name")} ／ ${JL.shop(s, "menu")}`)
                                 .concat(EXTRA_MENUS.map(k => JL.t(k))).join("　　◆　　");
  const src = window.JATCHU_SOURCE, now = new Date();
  $("shopsUpd").textContent = src === "sheet" ? JL.t("bd.updated", { t: pad(now.getHours()) + ":" + pad(now.getMinutes()) })
                            : JL.t(src === "cache" ? "bd.src.cache" : "bd.src.sample");
}

function renderEvents(){
  $("events").innerHTML = EVENTS.map(e =>
    `<tr><td class="time">${e.time}</td><td><span class="glow">${esc(JL.pick(e.title))}</span><span class="place">📍 ${esc(JL.pick(e.place))}</span></td></tr>`
  ).join("");
}

JL.switcher($("langSw"));
renderShops(); renderEvents(); renderTrams();
document.addEventListener("jatchu-lang", () => { renderShops(); renderEvents(); renderTrams(); });
setInterval(renderTrams, 5000);
// スプレッドシートを読み込めたら表示しなおす。そのあとも 2 分ごとに読み直す
window.JATCHU_READY.then(ok => { if (ok) renderShops(); });
setInterval(() => window.jatchuReload().then(ok => { if (ok) renderShops(); }), 120000);
</script>
</body>
</html>
