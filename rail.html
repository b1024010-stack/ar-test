<!doctype html>
<html lang="ja">
<head>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    #stage { position: absolute; overflow: hidden; }
    #stage video, #stage img, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gl, #ov { z-index: 2; }
    #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px; background: linear-gradient(#1b2a4a, #0b1020); overflow-y: auto; }
    #start h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .06em; }
    #start .sub { margin: 0 0 16px; opacity: .8; font-size: 13px; }
    .train { display: inline-block; margin: 0 0 14px; padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.12); }
    .warn { max-width: 420px; text-align: left; background: #3a1010; border: 1px solid #ff6b5a; border-radius: 10px;
      padding: 12px 14px; font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
    .warn b { color: #ffb3a8; }
    .btn { display: block; width: 260px; margin: 6px auto; font-size: 17px; padding: 13px 20px; border: 0; border-radius: 999px;
      background: #e8c15a; color: #1b2a4a; font-weight: bold; text-align: center; cursor: pointer; }
    .btn.sec { background: transparent; color: #e8c15a; border: 2px solid #e8c15a; }
    .btn input { display: none; }
    #msg { font-size: 12px; opacity: .7; margin-top: 10px; min-height: 1em; }
    #status { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 14px; white-space: nowrap; z-index: 5; }
    .tb { position: fixed; top: calc(8px + env(safe-area-inset-top)); z-index: 6; font-size: 12px; padding: 6px 10px;
      border: 0; border-radius: 6px; background: rgba(0,0,0,.5); color: #ffb020; text-decoration: none; }
    #back { left: 8px; } #dbgBtn { right: 8px; color: #fff; }

    #dbg label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }

<body>
  <div id="stage">

  <div id="start">

    <p class="sub">試作版 ・ 函館市電の線路をカメラに写すと、電車が走ってきます</p>
    <div class="train" id="trainName">🚋 花もめん号</div>
    <div class="warn">
      <b>⚠ 安全のために</b><br>
      ・<b>線路や車道には絶対に立ち入らず</b>、歩道や安全地帯から使ってください<br>
      ・本物の電車や車が近づいたら、すぐに画面から目を離してください<br>
      ・歩きながら使わないでください
    </div>
    <button class="btn" id="camBtn" disabled>読み込み中…</button>

    <div id="msg"></div>

<script src="shops.js"></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* =========================================================
   設定
   ========================================================= */
const RAIL_SPACING = 1.372 + 0.065;  // レールの中心どうしの間隔 [m]（函館市電の軌間 1372mm ＋ レール頭の幅）
const PROC_W = 480;                  // 画像処理の横幅 [px]
const STOP_AT = 14;                  // 電車が止まる位置（カメラの足元から線路ぞいに何m先か）
const APPROACH_FROM = 90;            // 電車が現れる位置 [m]
const H_MIN = 0.6, H_MAX = 2.6;      // ありえるカメラの高さ [m]（これ以外のレールの組は捨てる）
const SIDE_RANGE = 60;               // 横から見たとき、電車が現れる・去っていく距離 [m]

const params = new URLSearchParams(location.search);
const shopId = params.get('shop') || 'hanamomen';
const $ = (id) => document.getElementById(id);
let debug = params.has('debug');

/* ---------- 電車の名前・もどる ---------- */
{
  const s = (window.JATCHU_SHOPS || []).find((x) => x.id === shopId);
  $('trainName').textContent = '🚋 ' + (s ? s.name + '号' : '花もめん号');
  $('back').href = 'mini.html?shop=' + encodeURIComponent(shopId);
}

/* ---------- 端末に保存する設定 ---------- */
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let focalRatio = +(params.get('f') || store.get('railFocal') || 0.8);
let sens = +(store.get('railSens') || 35);
$('focal').value = Math.round(focalRatio * 100); $('focalV').textContent = focalRatio.toFixed(2);
$('sens').value = sens; $('sensV').textContent = sens;
$('focal').oninput = () => { focalRatio = $('focal').value / 100; $('focalV').textContent = focalRatio.toFixed(2); store.set('railFocal', focalRatio); updateCamera(); };
$('sens').oninput = () => { sens = +$('sens').value; $('sensV').textContent = sens; store.set('railSens', sens); };
// 動画を横から撮ったときだけ使う「スマホの下向きの傾き」（カメラで使うときはセンサーで自動）
let pitchDeg = +(params.get('pitch') || store.get('railPitch') || 20);
$('pitch').value = pitchDeg; $('pitchV').textContent = pitchDeg + '°';
$('pitch').oninput = () => { pitchDeg = +$('pitch').value; $('pitchV').textContent = pitchDeg + '°'; store.set('railPitch', pitchDeg); };
$('dbgBtn').onclick = () => { debug = !debug; $('dbg').hidden = !debug; if (!debug) octx.clearRect(0,0,ov.width,ov.height); };

/* =========================================================
   Three.js
   ========================================================= */
const video = $('video'), glCanvas = $('gl'), ov = $('ov'), octx = ov.getContext('2d'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5));

// 線路座標: 原点=足元の線路の中心, X=線路の奥向き, Y=上, Z=横
const anchor = new THREE.Group(); anchor.matrixAutoUpdate = false; anchor.visible = false; scene.add(anchor);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-20, 40, 15); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 120 });
const train = new THREE.Group(); anchor.add(train);
train.add(sun); sun.target = train;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = 0.01; ground.receiveShadow = true; train.add(ground);

let trainReady = false;
new GLTFLoader().load(`tram-${shopId}.glb?v=1`, onModel, undefined,
  () => new GLTFLoader().load('tram-hanamomen.glb?v=1', onModel));
function onModel(gltf) {
  const m = gltf.scene;
  m.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  train.add(m);                     // モデルは実物大 [m]・X が車体の長さ・Y が上
  trainReady = true;
  if (sourceReady) enableStart();
}

/* =========================================================
   映像・レイアウト
   ========================================================= */
let srcW = 0, srcH = 0, source = null, sourceReady = true;
const proc = document.createElement('canvas'), pctx = proc.getContext('2d', { willReadFrequently: true });
let pw = 0, ph = 0;
function focalPx() { return focalRatio * Math.max(srcW, srcH); }
function updateCamera() {
  if (!srcW) return;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(srcH / 2 / focalPx()));
  camera.aspect = srcW / srcH; camera.updateProjectionMatrix();
}
function layout() {
  if (!srcW) return;
  const W = innerWidth, H = innerHeight, sc = Math.max(W / srcW, H / srcH);
  const w = srcW * sc, h = srcH * sc;
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: (W - w) / 2 + 'px', top: (H - h) / 2 + 'px' });
  renderer.setSize(w, h, false); ov.width = w; ov.height = h; updateCamera();
}
addEventListener('resize', layout);

/* =========================================================
   重力センサー（スマホの傾き）→ カメラから見た「上」
   ========================================================= */
let devUp = null, useSensor = false;
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = THREE.MathUtils.degToRad(e.beta), g = THREE.MathUtils.degToRad(e.gamma);
  const u = new THREE.Vector3(-Math.cos(b) * Math.sin(g), Math.sin(b), Math.cos(b) * Math.cos(g));
  devUp = devUp ? devUp.lerp(u, 0.3).normalize() : u;
}
function enableSensors() {
  const DOE = window.DeviceOrientationEvent; if (!DOE) return;
  const listen = () => addEventListener('deviceorientation', onOrient);
  if (typeof DOE.requestPermission === 'function') DOE.requestPermission().then((r) => r === 'granted' && listen()).catch(() => {});
  else listen();
}
// カメラ座標（x右, y下, z奥）での上向き。センサーが無いとき（動画）は null
function upFromSensor() {
  if (!useSensor || !devUp) return null;
  const a = THREE.MathUtils.degToRad(screen.orientation?.angle ?? window.orientation ?? 0);
  const sx = devUp.x * Math.cos(a) - devUp.y * Math.sin(a), sy = devUp.x * Math.sin(a) + devUp.y * Math.cos(a);
  return new THREE.Vector3(sx, -sy, -devUp.z).normalize();
}

/* =========================================================
   レール検出（エッジ → ハフ変換で直線 → レールの組）
   正面（線路の奥を見る）でも、横（道路の向こうの線路を見る）でも使える
   ========================================================= */
let gray, mag, ang, acc;
const NT = 180;
const COS = new Float32Array(NT), SIN = new Float32Array(NT);
for (let t = 0; t < NT; t++) { COS[t] = Math.cos(t * Math.PI / NT); SIN[t] = Math.sin(t * Math.PI / NT); }

function detectLines(img) {
  const w = pw, h = ph, n = w * h;
  if (!gray || gray.length !== n) { gray = new Float32Array(n); mag = new Float32Array(n); ang = new Float32Array(n); }
  const d = img.data;
  for (let i = 0, j = 0; i < n; i++, j += 4) gray[i] = d[j] * 0.3 + d[j + 1] * 0.59 + d[j + 2] * 0.11;
  const y0 = Math.floor(h * 0.08);              // いちばん上（空）は使わない。横から見ると線路は画面の上の方にも来る
  let cnt = 0;
  mag.fill(0);
  for (let y = Math.max(1, y0); y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1] - gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1];
    const gy = gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1] - gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1];
    const m = Math.hypot(gx, gy);
    if (m > sens * 4) { mag[i] = m; ang[i] = Math.atan2(gy, gx); cnt++; }
  }
  // ハフ変換（勾配の向きに合う角度だけ投票）。ρ は画像中心から。横から見た水平に近い線も数える
  const R = Math.ceil(Math.hypot(w, h) / 2), NR = 2 * R + 1;
  if (!acc || acc.length !== NT * NR) acc = new Float32Array(NT * NR); else acc.fill(0);
  const cx = w / 2, cy = h / 2;
  for (let y = y0; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; if (!mag[i]) continue;
    const t0 = Math.round(((ang[i] % Math.PI) + Math.PI) % Math.PI / Math.PI * NT);
    for (let dt = -5; dt <= 5; dt++) {
      const t = (t0 + dt + NT) % NT;
      const rr = Math.round((x - cx) * COS[t] + (y - cy) * SIN[t]) + R;
      acc[t * NR + rr] += 1;
    }
  }
  // 山を拾う（近い山はまとめる。横から見るとレール2本が近いので、まとめる幅は小さめ）
  const lines = [];
  const minVotes = Math.max(16, Math.min(w, h) * 0.12);
  for (let k = 0; k < 24; k++) {
    let best = 0, bi = -1;
    for (let i = 0; i < acc.length; i++) if (acc[i] > best) { best = acc[i]; bi = i; }
    if (best < minVotes) break;
    const t = Math.floor(bi / NR), r = bi % NR - R;
    lines.push({ t: t * Math.PI / NT, r, v: best });
    for (let tt = Math.max(0, t - 4); tt <= Math.min(NT - 1, t + 4); tt++)
      for (let rr = Math.max(0, r + R - 4); rr <= Math.min(NR - 1, r + R + 4); rr++) acc[tt * NR + rr] = 0;
  }
  for (const L of lines) refine(L, y0);
  return { lines, edges: cnt };
}
// ハフ変換の角度は1°きざみで粗いので、線の近くのエッジ点に直線を当てはめ直して精度を上げる
// （横から見たレールはほぼ平行なので、わずかな角度の違いが大事）
function refine(L, y0) {
  const w = pw, h = ph, c = Math.cos(L.t), s = Math.sin(L.t);
  let sw = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
  for (let y = y0; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, m = mag[i]; if (!m) continue;
    const X = x - w / 2, Y = y - h / 2;
    if (Math.abs(X * c + Y * s - L.r) > 2.5) continue;
    if (Math.abs(Math.cos(ang[i] - L.t)) < 0.94) continue;        // 勾配の向きが合わない点は使わない
    sw += m; sx += m * X; sy += m * Y; sxx += m * X * X; syy += m * Y * Y; sxy += m * X * Y;
  }
  if (sw <= 0) return;
  const mx = sx / sw, my = sy / sw;
  const cxx = sxx / sw - mx * mx, cyy = syy / sw - my * my, cxy = sxy / sw - mx * my;
  // 主成分（線の向き）に直交する向きが法線
  const th = 0.5 * Math.atan2(2 * cxy, cxx - cyy);                 // 線の向きの角度
  let t = th + Math.PI / 2;
  t = ((t % Math.PI) + Math.PI) % Math.PI;
  const r = mx * Math.cos(t) + my * Math.sin(t);
  if (Math.abs(Math.cos(t - L.t)) > 0.98) { L.t = t; L.r = r; }
}
// 直線 x cosθ + y sinθ = ρ（中心原点）
const lineH = (L) => [Math.cos(L.t), Math.sin(L.t), -L.r];                       // 同次座標
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const linePt = (L, s) => [L.r * Math.cos(L.t) - s * Math.sin(L.t), L.r * Math.sin(L.t) + s * Math.cos(L.t)];
const xAtY = (L, y) => (L.r - y * Math.sin(L.t)) / Math.cos(L.t);
const yAtX = (L, x) => (L.r - x * Math.cos(L.t)) / Math.sin(L.t);

// レールらしさ：線にそって、細い「暗い溝」が続いているか（函館の路面のレールは、溝が黒い線に見える）
// 白線（明るいだけ）・段差や縁石（片側だけ明るい）・路面のざらつき（続かない）は低くなる
function railness(L) {
  const nx = Math.cos(L.t), ny = Math.sin(L.t), Rm = Math.hypot(pw, ph) / 2;
  let hit = 0, tot = 0;
  const med = (v) => { const u = [...v].sort((p, q) => p - q); return u[u.length >> 1]; };
  for (let s = -Rm; s <= Rm; s += 3) {
    const [x0, y0] = linePt(L, s);
    if (x0 < -pw / 2 + 2 || x0 > pw / 2 - 2 || y0 < -ph * 0.42 || y0 > ph / 2 - 2) continue;
    const at = (k) => {
      const X = Math.round(x0 + nx * k + pw / 2), Y = Math.round(y0 + ny * k + ph / 2);
      return (X < 0 || Y < 0 || X >= pw || Y >= ph) ? NaN : gray[Y * pw + X];
    };
    const L1 = [], R1 = [];
    for (let k = 10; k <= 15; k++) { L1.push(at(-k)); R1.push(at(k)); }
    if (L1.some(isNaN) || R1.some(isNaN)) continue;
    const bl = med(L1), br = med(R1);
    tot++;
    if (Math.abs(bl - br) > 18) continue;                       // 片側だけ明るい（段差・縁石・白線のふち）
    const bg = (bl + br) / 2;
    const mad = med([...L1, ...R1].map((v) => Math.abs(v - bg)));
    const thr = Math.max(10, 3 * mad);                          // 路面のざらつきより濃いこと
    let dark = 0, bright = 0, mn = 1e9;
    for (let k = -4; k <= 4; k++) { const v = at(k); if (v < bg - thr) dark++; if (v > bg + 40) bright++; if (v < mn) mn = v; }
    if (bright >= 4) continue;                                  // 太く明るい＝白線などのペンキ
    if (dark >= 1 && dark <= 4 && bg - mn > thr) hit++;        // 細くて暗い溝
  }
  return tot >= 4 ? hit / tot : 0;
}

// 線が点 V（同次座標）に向かっているか：角度のずれ（ラジアン）
function offVP(L, V) {
  const px = L.r * Math.cos(L.t), py = L.r * Math.sin(L.t);
  const dx = V[0] - px * V[2], dy = V[1] - py * V[2];
  const n = Math.hypot(dx, dy); if (n < 1e-9) return 0;
  return Math.abs(Math.asin(Math.max(-1, Math.min(1, (dx * Math.cos(L.t) + dy * Math.sin(L.t)) / n))));
}
/* ---------- レールの組から、地面と線路の向き・カメラの高さを求める ---------- */
let prev = null;       // 前フレームの結果（なめらかにするため）
let pick = null;       // タップで選んだレール { col, lo, hi }
let lastLines = [], taps = [];
const YB = () => ph * 0.42;                      // 正面のとき：測る高さ（画面の下の方）
// 測る位置での座標：col=false なら「下の方の横線」との交点の x、true なら「画面中央の縦線」との交点の y
const measure = (L, col) => col ? yAtX(L, 0) : xAtY(L, YB());
function solve(lines) {
  if (lines.length < 2) return null;
  for (const L of lines) L.rail ??= railness(L);

  const f = focalPx() * pw / srcW;               // 処理画像での焦点距離
  const sensorUp = upFromSensor();
  let best = null;
  for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++) {
    const A = lines[i], B = lines[j];
    // 2本の線の交わる点（消失点）。横から見たときはずっと遠く（ほぼ平行）
    const V = cross3(lineH(A), lineH(B));
    const Vn = Math.hypot(V[0], V[1], V[2]); if (Vn < 1e-9) continue;
    const fin = Math.abs(V[2]) > 1e-6 * Math.hypot(V[0], V[1]);
    const vx = fin ? V[0] / V[2] : Infinity, vy = fin ? V[1] / V[2] : Infinity;
    // 線が寝ている（横から見た線路）なら画面中央の縦線上で、立っている（正面）なら下の方の横線上で測る
    const col = Math.abs(Math.sin(A.t)) > 0.7 && Math.abs(Math.sin(B.t)) > 0.7;
    if (!col) {
      if (!fin || vy > YB() - 10 || Math.abs(vx) > pw * 2.5) continue;   // 正面：消失点は画面の上の方
    } else if (fin && Math.abs(vx) < pw * 0.6 && Math.abs(vy) < ph * 0.6) continue;  // 画面の中で交わる2本は線路ではない
    const ma = measure(A, col), mb = measure(B, col);
    if (!isFinite(ma) || !isFinite(mb) || Math.abs(ma - mb) < 3) continue;
    if (col && (Math.abs(ma) > ph / 2 || Math.abs(mb) > ph / 2)) continue;
    // 線路の向き d（カメラ座標 x右・y下・z奥）
    const d = new THREE.Vector3(V[0] / f, V[1] / f, V[2]).normalize();
    if (d.z < 0 || (Math.abs(d.z) < 1e-3 && d.x < 0)) d.negate();
    // 上向き u：センサー → それを使う／動画の正面 → 「画面の横軸は地面と平行」／動画の横 → 傾きスライダー
    const side = Math.abs(d.z) < 0.57;         // 線路の向きが、カメラの向きから55°以上ずれていれば「横から」
    let u;
    if (sensorUp) u = sensorUp.clone();
    else if (Math.abs(d.z) > 0.57) {
      const lat0 = new THREE.Vector3(1, 0, 0).addScaledVector(d, -d.x).normalize();
      u = new THREE.Vector3().crossVectors(lat0, d);
    } else {
      const p = THREE.MathUtils.degToRad(pitchDeg);
      u = new THREE.Vector3(0, -Math.cos(p), -Math.sin(p));
    }
    u.addScaledVector(d, -u.dot(d)).normalize();
    if (u.y > 0) u.negate();                     // y下向きの座標なので、上は y<0
    const lat = new THREE.Vector3().crossVectors(d, u).normalize();
    const pa = col ? [0, ma] : [ma, YB()], pb = col ? [0, mb] : [mb, YB()];
    const q = (x, y) => { const r = new THREE.Vector3(x / f, y / f, 1), k = u.dot(r); return k < -1e-4 ? r.multiplyScalar(-1 / k) : null; };
    const qa = q(...pa), qb = q(...pb); if (!qa || !qb) continue;
    const sep = Math.abs(qa.clone().sub(qb).dot(lat));
    const hgt = RAIL_SPACING / sep;              // レール間隔 1.437m になるカメラの高さ
    if (hgt < H_MIN || hgt > H_MAX) continue;
    // レールらしくない線（白線・ノイズ）は使わない。片方が少し弱くても、2本合わせて十分ならよい
    if (!pick && (Math.min(A.rail, B.rail) < 0.12 || A.rail + B.rail < 0.5)) continue;
    // ほかの線（縁石・白線・もう1組のレール）も同じ向きにそろっているか。斜めのひび割れどうしの組を外す
    let support = 0;
    for (const L of lines) if (L !== A && L !== B && offVP(L, V) < 0.012) support += L.v;
    if (side && support < 60) continue;
    let score = (A.v + B.v) * 0.5 + (A.rail + B.rail) * 150 + Math.min(support, 600) * 0.2;
    score -= Math.abs(hgt - 1.4) * (side ? 150 : 60);   // 手で持った高さらしいものを優先（横からは高さの誤差が出やすい）
    const lo = Math.min(ma, mb), hi = Math.max(ma, mb);
    if (pick) {                                  // タップで選んだレールに近い組を最優先
      if (pick.col !== col) continue;
      const miss = Math.abs(lo - pick.lo) + Math.abs(hi - pick.hi);
      if (miss > Math.min(pw, ph) * 0.2) continue;
      score -= miss * 20;
    } else if (prev && prev.col === col) {       // 前フレームと近いものを優先
      score -= Math.abs((lo + hi) / 2 - prev.mid) * 1.0;
    }
    if (!best || score > best.score) best = { score, A, B, side, col, d, u, lat, hgt, qa, qb, lo, hi, mid: (lo + hi) / 2 };
  }
  return best;
}

/* ---------- 求めた姿勢を、なめらかにして3Dに反映 ---------- */
const S = { d: null, u: null, c: null, side: null };
let lastFound = 0;
function applyPose(b) {
  // 横から見ると、レールの間隔から求めた高さは傾きのわずかな誤差で大きく変わるので、
  // 手で持つ高さとしてありえる範囲（1.1〜1.7m）におさえて使う
  const hUse = b.side ? Math.min(1.7, Math.max(1.1, b.hgt)) : b.hgt;
  const c = b.qa.clone().add(b.qb).multiplyScalar(hUse / 2);    // 測った所の線路の中心（カメラ座標）
  if (S.d && S.d.dot(b.d) < 0) b.d.negate();   // 線路の向きの「前後」を前フレームとそろえる（横から見ると入れかわりやすい）
  if (S.side !== b.side || (S.d && S.d.dot(b.d) < 0.9)) { S.d = null; t0 = performance.now(); }  // 見方が変わったら最初から
  const k = S.d ? 0.25 : 1;
  S.d = S.d ? S.d.lerp(b.d, k).normalize() : b.d.clone();
  S.u = S.u ? S.u.lerp(b.u, k).normalize() : b.u.clone();
  S.c = S.c && k < 1 ? S.c.lerp(c, k) : c;
  S.side = b.side;
  // カメラ座標（x右,y下,z奥）→ three（x右,y上,z手前）
  const T = (v) => new THREE.Vector3(v.x, -v.y, -v.z);
  const X = T(S.d), Y = T(S.u), Z = new THREE.Vector3().crossVectors(X, Y).normalize();
  const Yo = new THREE.Vector3().crossVectors(Z, X).normalize();
  const m = new THREE.Matrix4().makeBasis(X, Yo, Z); m.setPosition(T(S.c));
  anchor.matrix.copy(m); anchor.matrixWorldNeedsUpdate = true; anchor.visible = true;
}

/* ---------- 電車の動き ----------
   正面：奥から近づいて手前で止まり、また奥へ戻る
   横　：画面の端から入ってきて正面で止まり、反対側へ走り去る */
let t0 = performance.now();
function trainPos(now) {
  const t = ((now - t0) / 1000) % 26;
  const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));
  const inn = (u) => 1 - (1 - u) * (1 - u), out = (u) => u * u;     // 減速しながら止まる／加速して出ていく
  if (S.side) {
    if (t < 10) return -SIDE_RANGE * (1 - inn(Math.min(1, t / 10)));
    if (t < 16) return 0;
    return SIDE_RANGE * out(Math.min(1, (t - 16) / 10));
  }
  if (t < 10) return APPROACH_FROM + (STOP_AT - APPROACH_FROM) * ease(t / 10);
  if (t < 16) return STOP_AT;
  return STOP_AT + (APPROACH_FROM - STOP_AT) * ease((t - 16) / 10);
}

/* =========================================================
   ループ
   ========================================================= */
let fps = 0, fc = 0, ft = performance.now(), procMs = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!srcW) return;
  const a = performance.now();
  pctx.drawImage(source, 0, 0, pw, ph);
  const img = pctx.getImageData(0, 0, pw, ph);
  const { lines, edges } = detectLines(img);
  const b = solve(lines);
  procMs = procMs * 0.9 + (performance.now() - a) * 0.1;
  lastLines = lines;
  if (b) {
    prev = b; lastFound = now; applyPose(b);
    if (pick) { pick.lo += (b.lo - pick.lo) * 0.5; pick.hi += (b.hi - pick.hi) * 0.5; }   // 選んだレールを追いかける
  }
  else if (now - lastFound > 1200) { anchor.visible = false; prev = null; S.d = S.u = S.c = null; S.side = null; if (now - lastFound > 4000) pick = null; }
  if (trainReady) train.position.set(trainPos(now), 0, 0);
  renderer.render(scene, camera);

  const st = $('status');
  st.hidden = false;
  st.textContent = taps.length === 1 ? 'もう1本のレールをタップしてください'
    : anchor.visible ? `🚋 走行中（${S.side ? '横から' : '正面から'}）・ちがう線路ならレールを2本タップ`
    : '線路を写してください（正面からでも横からでもOK）';

  if (++fc >= 15) { fps = fc * 1000 / (now - ft); fc = 0; ft = now; }
  if (debug) drawDebug(lines, b, edges);
  window.__rail = { lines: lines.length, found: !!b, side: b && b.side, hgt: b && b.hgt };
}
function drawDebug(lines, b, edges) {
  const W = ov.width, H = ov.height; octx.clearRect(0, 0, W, H);
  const sx = W / pw, sy = H / ph, Rm = Math.hypot(pw, ph);
  const P = ([x, y]) => [(x + pw / 2) * sx, (y + ph / 2) * sy];
  const draw = (L, col, wdt) => {
    const [x1, y1] = P(linePt(L, -Rm)), [x2, y2] = P(linePt(L, Rm));
    octx.strokeStyle = col; octx.lineWidth = wdt; octx.beginPath(); octx.moveTo(x1, y1); octx.lineTo(x2, y2); octx.stroke();
  };
  for (const L of lines) draw(L, L.rail >= 0.25 ? 'rgba(255,255,0,.6)' : 'rgba(255,255,255,.2)', 1.5);
  if (b) { draw(b.A, '#3dff6e', 4); draw(b.B, '#3dff6e', 4); }
  $('info').innerHTML = `直線 ${lines.length} 本 / エッジ ${edges}<br>` +
    (b ? `${b.side ? '横から' : '正面から'} ・ カメラの高さ ${b.hgt.toFixed(2)} m<br>` : 'レールの組 なし<br>') +
    `処理 ${procMs.toFixed(1)} ms / ${fps.toFixed(0)} fps<br>センサー ${upFromSensor() ? '使用中' : 'なし（動画）'}`;
}

/* ---------- レールをタップして選ぶ（自動でちがう線を選んだときの手直し） ---------- */
stage.addEventListener('pointerup', (e) => {
  if (!srcW || !lastLines.length) return;
  const rc = ov.getBoundingClientRect();
  const x = (e.clientX - rc.left) / rc.width * pw - pw / 2, y = (e.clientY - rc.top) / rc.height * ph - ph / 2;
  let best = null, bd = Infinity;
  for (const L of lastLines) { const dd = Math.abs(x * Math.cos(L.t) + y * Math.sin(L.t) - L.r); if (dd < bd) { bd = dd; best = L; } }
  if (!best || bd > Math.min(pw, ph) * 0.06) return;
  taps.push(best);
  if (taps.length === 2) {
    const col = Math.abs(Math.sin(taps[0].t)) > 0.7 && Math.abs(Math.sin(taps[1].t)) > 0.7;
    const a = measure(taps[0], col), b = measure(taps[1], col);
    pick = { col, lo: Math.min(a, b), hi: Math.max(a, b) }; taps = []; prev = null;
  }
});

/* =========================================================
   開始
   ========================================================= */
function setSource(el, w, h) {
  source = el; srcW = w; srcH = h;
  pw = PROC_W; ph = Math.round(PROC_W * srcH / srcW); proc.width = pw; proc.height = ph;
  layout(); $('start').hidden = true; $('dbgBtn').hidden = false; $('dbg').hidden = !debug;
  t0 = performance.now(); requestAnimationFrame(loop);
}
async function startCamera() {
  enableSensors(); useSensor = true;
  $('camBtn').disabled = true; $('camBtn').textContent = '起動中…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    video.srcObject = stream; await video.play();
    setSource(video, video.videoWidth, video.videoHeight);
  } catch (e) {
    $('msg').textContent = 'カメラを起動できませんでした: ' + e.message;
    $('camBtn').disabled = false; $('camBtn').textContent = 'もう一度試す';
  }
}
function startFile(file) {
  useSensor = false;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('image/')) {
    const im = new Image(); im.onload = () => { stage.appendChild(im); im.style.zIndex = 0; setSource(im, im.naturalWidth, im.naturalHeight); }; im.src = url;
    video.hidden = true; return;
  }
  video.src = url; video.loop = true;
  video.onloadedmetadata = async () => { await video.play().catch(() => {}); setSource(video, video.videoWidth, video.videoHeight); };
}
$('fileIn').onchange = (e) => { const f = e.target.files[0]; if (f) startFile(f); };

function enableStart() {
  $('camBtn').disabled = false; $('camBtn').textContent = '📷 カメラで始める';
  $('camBtn').onclick = startCamera;
}
// テスト用： ?img=画像のURL でその画像を使う
if (params.get('img')) {
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => { stage.appendChild(im); video.hidden = true; useSensor = false; debug = true; setSource(im, im.naturalWidth, im.naturalHeight); };
  im.src = params.get('img');
}
</script>
</body>
</html>
