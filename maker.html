<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>じぶんの電車をつくる | ジャッチュ</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@700&family=Kosugi+Maru&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1c2a44; --line:#d5dbe2; --bg:#e9eef3; --amber:#ffb020; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:sans-serif; background:#fff; color:var(--ink); }

    .viewer { position:sticky; top:0; z-index:2; height:52vh; min-height:300px; background:var(--bg); }
    model-viewer { width:100%; height:100%; }
    .top { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center; }
    .back { font-family:"DotGothic16",monospace; font-size:14px; text-decoration:none; color:var(--amber);
            background:#0b0b0c; padding:7px 12px; border-radius:4px; }
    .ttl { font-size:13px; color:#555; background:rgba(255,255,255,.8); padding:4px 8px; border-radius:4px; }
    .ar-btn { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); padding:12px 26px;
              border:none; border-radius:30px; background:#1a73e8; color:#fff; font-size:16px; white-space:nowrap; }

    .panel { max-width:560px; margin:0 auto; padding:14px 16px 40px; }
    .sec { border-bottom:1px solid var(--line); padding:14px 0; }
    .sec h2 { margin:0 0 10px; font-size:15px; }
    .sec h2 small { font-weight:normal; color:#777; font-size:12px; margin-left:6px; }

    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .swatches { display:flex; gap:8px; flex-wrap:wrap; }
    .sw { width:34px; height:34px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
    .sw.on { box-shadow:0 0 0 3px var(--ink); }
    input[type=color] { width:44px; height:36px; border:1px solid var(--line); border-radius:6px; padding:2px; background:#fff; }
    label.small { font-size:12px; color:#666; }

    .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .opt { border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px 4px; font-size:13px; cursor:pointer; color:var(--ink); }
    .opt.on { border-color:var(--ink); background:var(--ink); color:#fff; }

    input[type=text] { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
    .file { display:inline-block; padding:10px 16px; border:1px dashed #8a97a6; border-radius:8px; cursor:pointer; font-size:14px; }
    .file input { display:none; }
    .linkbtn { background:none; border:none; color:#c0392b; font-size:13px; cursor:pointer; text-decoration:underline; }

    .preview { margin-top:4px; }
    .preview canvas { width:100%; height:auto; border-radius:6px; border:1px solid var(--line); display:block; }
    .hint { font-size:12px; color:#777; line-height:1.7; margin-top:8px; }
  </style>
</head>
<body>

<div class="viewer">
  <model-viewer id="mv"
    src="mini-hanamomen.glb?v=5"
    alt="じぶんでデザインした電車がミニチュアの線路を走るモデル"
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
    camera-controls touch-action="pan-y" camera-orbit="20deg 62deg auto"
    autoplay animation-name="Loop" shadow-intensity="1">
    <div class="top">
      <a class="back" href="board.html">← 案内板</a>
      <span class="ttl" id="ttl">じぶんの電車</span>
    </div>
    <button slot="ar-button" class="ar-btn">📷 ARで走らせる</button>
    <button class="ar-btn" id="iosAr" hidden>📷 ARで走らせる</button>
  </model-viewer>
</div>

<div class="panel">

  <div class="sec">
    <h2>① 色<small>車体の色と、模様・帯の色</small></h2>
    <div class="row" style="margin-bottom:10px">
      <label class="small">車体</label>
      <div class="swatches" id="sw1"></div>
      <input type="color" id="c1" value="#1d4e89">
    </div>
    <div class="row">
      <label class="small">模様</label>
      <div class="swatches" id="sw2"></div>
      <input type="color" id="c2" value="#f2c14e">
    </div>
  </div>

  <div class="sec">
    <h2>② 模様</h2>
    <div class="opts" id="pats"></div>
  </div>

  <div class="sec">
    <h2>③ 文字<small>電車の名前やメッセージ</small></h2>
    <input type="text" id="txt" maxlength="14" value="函館だいすき号" placeholder="例：ゆう号">
    <div class="row" style="margin-top:10px">
      <label class="small">文字の色</label>
      <input type="color" id="c3" value="#ffffff">
    </div>
    <div class="opts" id="fonts" style="margin-top:10px"></div>
  </div>

  <div class="sec">
    <h2>④ 写真<small>車体の横に貼られます</small></h2>
    <div class="row">
      <label class="file">📷 写真をえらぶ<input type="file" id="photo" accept="image/*"></label>
      <button class="linkbtn" id="rmPhoto" hidden>写真を外す</button>
    </div>
    <p class="hint">写真はこのスマホ・パソコンの中だけで使われ、どこにも送られません。</p>
  </div>

  <div class="sec" style="border-bottom:none">
    <h2>車体の横の見本</h2>
    <div class="preview"><canvas id="pv" width="943" height="200"></canvas></div>
    <p class="hint">
      できたら上の「📷 ARで走らせる」を押すと、机や床の上をじぶんの電車が走ります。<br>
    </p>
  </div>
</div>

<script>
/* ---------- 設定 ---------- */
const PRESET1 = ["#1d4e89","#b22222","#2e7d32","#6a1b9a","#222222","#f5f0e6"];
const PRESET2 = ["#f2c14e","#ffffff","#ff7aa2","#4fd8ff","#c9a14a","#e65100"];
const PATTERNS = [["none","なし"],["stripe","ストライプ"],["dots","水玉"],["seigaiha","青海波"],["check","チェック"],["wave","波"]];
const FONTS = [["'Noto Sans JP',sans-serif","ゴシック",900],["'Noto Serif JP',serif","明朝",700],["'Kosugi Maru',sans-serif","まる文字",400]];

// テクスチャの中で、ラッピングを描く場所（2048×2048 画像での位置）
const SIDES = [[81,103,1966,501],[81,605,1966,1003]];
const ENDS  = [[8,1092,375,1515],[416,1092,784,1515]];

const S = { c1:"#1d4e89", c2:"#f2c14e", c3:"#ffffff", pat:"seigaiha", font:0, text:"函館だいすき号", photo:null };

/* ---------- 部品 ---------- */
const $ = id => document.getElementById(id);
function swatches(el, list, key, input){
  el.innerHTML = list.map(c => `<button class="sw" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join("");
  el.onclick = e => { const b = e.target.closest(".sw"); if(!b) return; S[key]=b.dataset.c; input.value=b.dataset.c; mark(); update(); };
  input.oninput = () => { S[key]=input.value; mark(); update(); };
  const mark = () => el.querySelectorAll(".sw").forEach(b => b.classList.toggle("on", b.dataset.c===S[key]));
  mark();
}
function options(el, list, key, labelIdx){
  el.innerHTML = list.map((o,i) => `<button class="opt" data-i="${i}">${o[labelIdx]}</button>`).join("");
  const mark = () => el.querySelectorAll(".opt").forEach((b,i) =>
    b.classList.toggle("on", key==="pat" ? list[i][0]===S.pat : i===S.font));
  el.onclick = e => { const b = e.target.closest(".opt"); if(!b) return;
    const i=+b.dataset.i; if(key==="pat") S.pat=list[i][0]; else S.font=i; mark(); update(); };
  mark();
}
swatches($("sw1"), PRESET1, "c1", $("c1"));
swatches($("sw2"), PRESET2, "c2", $("c2"));
options($("pats"), PATTERNS, "pat", 1);
FONTS.forEach((f,i)=>{}); options($("fonts"), FONTS, "font", 1);
$("fonts").querySelectorAll(".opt").forEach((b,i)=> b.style.fontFamily = FONTS[i][0]);
$("c3").oninput = () => { S.c3 = $("c3").value; update(); };
$("txt").oninput = () => { S.text = $("txt").value; update(); };

$("photo").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => { S.photo = img; $("rmPhoto").hidden = false; update(); };
  img.src = URL.createObjectURL(f);
};
$("rmPhoto").onclick = () => { S.photo = null; $("photo").value=""; $("rmPhoto").hidden = true; update(); };

/* ---------- 描画 ---------- */
function pattern(g, w, h, kind, col){
  g.save(); g.beginPath(); g.rect(0,0,w,h); g.clip(); g.fillStyle = col; g.strokeStyle = col;
  if (kind==="stripe"){ g.globalAlpha=.55; for(let x=-h; x<w; x+=70){ g.beginPath(); g.moveTo(x,h); g.lineTo(x+h,0); g.lineTo(x+h+26,0); g.lineTo(x+26,h); g.fill(); } }
  if (kind==="dots"){ g.globalAlpha=.6; for(let y=18,r=0; y<h; y+=44,r++) for(let x=(r%2?22:0); x<w; x+=44){ g.beginPath(); g.arc(x,y,9,0,7); g.fill(); } }
  if (kind==="check"){ g.globalAlpha=.35; const s=40; for(let y=0;y<h;y+=s) for(let x=0;x<w;x+=s) if(((x+y)/s)%2===0) g.fillRect(x,y,s,s); }
  if (kind==="wave"){ g.globalAlpha=.7; g.lineWidth=6; for(let y=24; y<h; y+=40){ g.beginPath(); for(let x=0;x<=w;x+=8) g.lineTo(x, y+9*Math.sin(x/28)); g.stroke(); } }
  if (kind==="seigaiha"){ g.globalAlpha=.55; g.lineWidth=4; const r=34;
    for(let row=0; row*r/2 < h+r; row++){ const y=row*r/2, off=(row%2)*r;
      for(let x=-2*r; x<w+2*r; x+=2*r) for(let k=r; k>0; k-=r/4){ g.beginPath(); g.arc(x+off,y,k,Math.PI,0); g.stroke(); } } }
  g.restore();
}
function fitText(g, text, maxW, size, fam, weight){
  let s = size; g.font = `${weight} ${s}px ${fam}`;
  while (g.measureText(text).width > maxW && s > 20){ s -= 4; g.font = `${weight} ${s}px ${fam}`; }
  return s;
}
function drawSide(g, w, h){
  const [fam,,wt] = FONTS[S.font];
  g.fillStyle = S.c1; g.fillRect(0,0,w,h);
  pattern(g, w, h*0.52, S.pat, S.c2);           // 窓まわり（上半分）に模様
  g.fillStyle = S.c2; g.fillRect(0,0,w,h*0.07);  // 屋根ぎわの帯
  g.fillRect(0,h*0.52,w,h*0.025);                // 窓の下の帯
  g.fillRect(0,h-h*0.05,w,h*0.05);               // すその帯
  // 写真（右側の下半分）
  let textW = w*0.9, textX = w*0.5;
  if (S.photo){
    const bh = h*0.40, bw = bh*1.5, bx = w - bw - w*0.04, by = h*0.555;
    const ir = S.photo.width/S.photo.height, br = bw/bh;
    let sw=S.photo.width, sh=S.photo.height, sx=0, sy=0;
    if (ir > br){ sw = sh*br; sx=(S.photo.width-sw)/2; } else { sh = sw/br; sy=(S.photo.height-sh)/2; }
    g.fillStyle="#fff"; g.fillRect(bx-6,by-6,bw+12,bh+12);
    g.drawImage(S.photo, sx,sy,sw,sh, bx,by,bw,bh);
    textW = bx - w*0.08; textX = (bx)/2;
  }
  if (S.text){
    const s = fitText(g, S.text, textW, h*0.3, fam, wt);
    g.fillStyle = S.c3; g.textAlign="center"; g.textBaseline="middle";
    g.lineWidth = s*0.08; g.strokeStyle = "rgba(0,0,0,.35)";
    g.strokeText(S.text, textX, h*0.76); g.fillText(S.text, textX, h*0.76);
  }
}
function drawEnd(g, w, h){
  const [fam,,wt] = FONTS[S.font];
  g.fillStyle = S.c1; g.fillRect(0,0,w,h);
  pattern(g, w, h*0.5, S.pat, S.c2);
  g.fillStyle = S.c2; g.fillRect(0,h*0.5,w,h*0.03); g.fillRect(0,h-h*0.05,w,h*0.05);
  if (S.text){
    const t = S.text.length > 6 ? S.text.slice(0,6) : S.text;
    const s = fitText(g, t, w*0.86, h*0.18, fam, wt);
    g.fillStyle = S.c3; g.textAlign="center"; g.textBaseline="middle"; g.fillText(t, w/2, h*0.75);
  }
}

const tex = document.createElement("canvas"); tex.width = tex.height = 2048;
const tg = tex.getContext("2d");
const base = new Image(); base.src = "wrap-base.jpg?v=1";

function paint(){
  if (base.complete && base.naturalWidth) tg.drawImage(base,0,0,2048,2048);
  else { tg.fillStyle="#3a2a24"; tg.fillRect(0,0,2048,2048); }
  for (const [x0,y0,x1,y1] of SIDES){ tg.save(); tg.beginPath(); tg.rect(x0,y0,x1-x0,y1-y0); tg.clip(); tg.translate(x0,y0); drawSide(tg,x1-x0,y1-y0); tg.restore(); }
  for (const [x0,y0,x1,y1] of ENDS){ tg.save(); tg.beginPath(); tg.rect(x0,y0,x1-x0,y1-y0); tg.clip(); tg.translate(x0,y0); drawEnd(tg,x1-x0,y1-y0); tg.restore(); }
  // 見本（側面）
  const pv = $("pv"), pg = pv.getContext("2d"), [x0,y0,x1,y1] = SIDES[0];
  pg.drawImage(tex, x0,y0,x1-x0,y1-y0, 0,0,pv.width,pv.height);
  $("ttl").textContent = (S.text || "じぶんの電車");
}

/* ---------- 3D の電車に貼る ---------- */
const mv = $("mv");
let wrapMat = null, lastUrl = null, timer = null, busy = false, again = false;
mv.addEventListener("load", () => {
  wrapMat = mv.model.materials.find(m => m.name === "H500_Wrap_Baked");
  apply();
});
async function apply(){
  if (!wrapMat) return;
  if (busy){ again = true; return; }
  busy = true;
  const blob = await new Promise(r => tex.toBlob(r, "image/jpeg", 0.9));
  const url = URL.createObjectURL(blob);
  try {
    const t = await mv.createTexture(url);
    wrapMat.pbrMetallicRoughness.baseColorTexture.setTexture(t);
  } catch(e){ console.error(e); }
  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = url; busy = false;
  if (again){ again = false; apply(); }
}
let update = function(){
  paint();
  clearTimeout(timer); timer = setTimeout(apply, 250);
}

/* ---------- iPhone：動く usdz をその場で作って AR で開く ---------- */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let template = null, iosUrl = null, iosTimer = null;
const loadTemplate = async () => template ||
  (template = new Uint8Array(await (await fetch("maker-template.usda?v=1")).arrayBuffer()));

const CRC = (() => { const t = new Uint32Array(256);
  for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function usdz(files){           // 無圧縮・64バイト境界の zip（usdz の決まり）
  const parts=[], cd=[]; let off=0;
  for (const [name,data] of files){
    const nb=new TextEncoder().encode(name), hdr=30+nb.length;
    const pad=(64-((off+hdr+4)%64))%64, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(hdr+4+pad));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint32(14,crc,true);
    h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,4+pad,true);
    new Uint8Array(h.buffer).set(nb,30); h.setUint16(hdr,12345,true); h.setUint16(hdr+2,pad,true);
    const c=new DataView(new ArrayBuffer(46+nb.length));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint32(16,crc,true);
    c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nb.length,true);
    c.setUint32(42,off,true); new Uint8Array(c.buffer).set(nb,46);
    parts.push(new Uint8Array(h.buffer), data); cd.push(new Uint8Array(c.buffer));
    off += h.byteLength + data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)], {type:"model/vnd.usdz+zip"});
}
async function buildIOS(){
  const tpl = await loadTemplate();
  const jpg = new Uint8Array(await (await new Promise(r => tex.toBlob(r,"image/jpeg",0.88))).arrayBuffer());
  if (iosUrl) URL.revokeObjectURL(iosUrl);
  iosUrl = URL.createObjectURL(usdz([["model.usda",tpl],["textures/wrap.jpg",jpg]]));
  return iosUrl;
}
if (isIOS){
  mv.removeAttribute("ar");            // model-viewer の AR ボタンの代わりに自前のボタンを使う
  const btn = $("iosAr"); btn.hidden = false;
  btn.onclick = async () => {
    btn.textContent = "準備中…";
    try {
      clearTimeout(iosTimer);
      const url = await buildIOS();
      const a = document.createElement("a");
      a.rel = "ar"; a.download = "jatchu-train.usdz"; a.href = url;
      a.appendChild(document.createElement("img"));
      a.click();
    } catch(e){ console.error(e); alert("ARの準備に失敗しました"); }
    btn.textContent = "📷 ARで走らせる";
  };
  loadTemplate();
}
const _update = update;
update = function(){ _update(); if (isIOS){ clearTimeout(iosTimer); iosTimer = setTimeout(buildIOS, 1200); } };

base.onload = update;
document.fonts && document.fonts.ready.then(update);
update();
</script>
</body>
</html>
