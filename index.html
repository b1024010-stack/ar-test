<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR テスト</title>

  <!-- model-viewer を読み込む -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; background: #eeeeee; }
    .ar-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: none; border-radius: 30px;
      background: #1a73e8; color: #ffffff; font-size: 16px;
    }
  </style>
</head>
<body>

  <model-viewer
    src="model.glb"
    alt="Blenderで作ったモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    autoplay>

    <button slot="ar-button" class="ar-btn">📷 ARで見る</button>
  </model-viewer>

</body>
</html>
